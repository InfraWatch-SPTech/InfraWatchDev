
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfraWatch.Dev - Relatórios</title>
    <link rel="icon" type="image/png" href="./assets/midias/main-icon-image.png">
    <link rel="stylesheet" href="./assets/css/global.css">
    <link rel="stylesheet" href="./assets/css/menu.css">
    <link rel="stylesheet" href="./assets/css/relatorios.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>

<main class="area_formulario">

                <div class="caixa_formulario">

                    <!-- CADASTRO DE RELATÓRIO -->

                    <section id="cadastro">

                        <h1 class="titulo_formulario">
                            CRIAR RELATÓRIO
                        </h1>

                        <form class="formulario_relatorio"
                            id="form-relatorio">

                            <div class="linha_tres_campos">

                                <div class="campo">
                                    <label for="titulo">
                                        Título do relatório
                                    </label>

                                    <input
                                        type="text"
                                        id="titulo"
                                        name="titulo"
                                        placeholder="Análise de desempenho - CPU e RAM"
                                        required
                                    >
                                </div>

                                <div class="campo">
                                    <label for="data">
                                        Data do relatório
                                    </label>

                                    <input
                                        type="date"
                                        id="data"
                                        name="data"
                                        required
                                    >
                                </div>

                                <div class="campo">
                                    <label for="servidor">
                                        Equipamento
                                    </label>

                                    <div class="caixa_selecao">
                                        <select
                                            id="servidor"
                                            name="servidor"
                                            required
                                        >
                                            <option value="" selected disabled>
                                                Carregando equipamentos...
                                            </option>
                                        </select>

                                        <i class="fa-solid fa-chevron-down icone_seta"></i>
                                    </div>
                                </div>

                            </div>

                            <div class="linha_campo_unico">
                                <div class="campo">
                                    <label for="detalhes">
                                        Relatório detalhado
                                    </label>

                                    <textarea
                                        id="detalhes"
                                        name="detalhes"
                                        rows="6"
                                        placeholder="Descreva as informações detalhadas do relatório..."
                                        required
                                    ></textarea>
                                </div>
                            </div>

                            <p id="mensagem-relatorio" class="mensagem"></p>

                            <div class="linha_botoes">
                                <button type="submit" id="botao-enviar">
                                    <i class="fa-solid fa-floppy-disk"></i>
                                    Cadastrar relatório
                                </button>
                            </div>

                        </form>

                    </section>

                    <!-- LISTAGEM DE RELATÓRIOS -->

                    <section id="relatorios" class="secao_relatorios">

                        <h2 class="titulo_formulario">
                            RELATÓRIOS CADASTRADOS
                        </h2>

                        <input
                            type="text"
                            id="filtro"
                            class="filtro_relatorios"
                            placeholder="Pesquisar por título ou equipamento..."
                        >

                        <p id="mensagem" class="mensagem">
                            Carregando relatórios...
                        </p>

                        <div class="lista_relatorios">

                            <table class="tabela_relatorios">

                                <thead>
                                    <tr>
                                        <th>Título</th>
                                        <th>Data</th>
                                        <th>Equipamento</th>
                                        <th>Descrição</th>
                                        <th>Ações</th>
                                    </tr>
                                </thead>

                                <tbody id="lista-relatorios"></tbody>

                            </table>

                        </div>

                    </section>

                </div>

            </main>

    <script src="./assets/js/redirecionamento.js"></script>
    <script src="./assets/js/sessao.js"></script>
    <script src="./assets/js/menu.js"></script>
    <script src="./assets/js/relatorios.js"></script>

</body>

</html>
