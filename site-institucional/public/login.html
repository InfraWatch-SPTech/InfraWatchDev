<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfraWatch.Dev - Login</title>
    <link rel="icon" type="image/png" href="./assets/midias/main-icon-image.png">
    <link rel="stylesheet" href="./assets/css/global.css">
    <link rel="stylesheet" href="./assets/css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>

<button id="btn-home" onclick="redirecionar('home')">
        <i class="fa-solid fa-arrow-left"></i>
        Home
    </button>

    <div class="pagina_log">
        <div class="autenticar">
            <button type="button" class="autenticar_btn active" id="tab-entrar">
                Entrar
            </button>
            <button type="button" class="autenticar_btn" id="tab-cadastrar">
                Cadastre-se
            </button>
        </div>

        <div class="login_card" id="contentLogin">
            <div class="login_esquerda">
                <div class="login_logo">
                    <h1>Infra<span>Watch</span></h1>
                </div>

                <div class="login_esquerda_content">
                    <div class="login_esquerda_text">
                        <h2>
                            Controle total dos seus
                            sistemas,
                            <span>antes que o
                            cliente perceba</span>
                        </h2>
                    </div>
                    <div class="login_esquerda_description">
                        <h6>
                            Acesse o painel para acompanhar em tempo
                            real a saúde da sua infraestrutura
                        </h6>
                    </div>
                </div>
            </div>

            <div class="login_direita">
                <form class="formulario_login" id="form-login">
                    <div class="formulario_login_title">
                        <h2>Acesse sua conta</h2>
                        <span>Entre para acompanhar seus painéis de monitoramento.</span>
                    </div>

                    <div class="inputs">
                        <label for="input-email">E-mail corporativo</label>
                        <input type="email" id="input-email" name="email" placeholder="voce@empresa.com" required>
                    </div>

                    <div class="inputs">
                        <label for="input-senha">Senha</label>
                        <input type="password" id="input-senha" name="senha" placeholder="********" required>
                    </div>

                    <a href="#" class="esqueci_a_senha">
                        Esqueci minha senha
                    </a>

                    <button type="submit" id="btn-entrar-plataforma">
                        Entrar na plataforma
                    </button>

                   
                </form>
            </div>
        </div>

    </div>

    <script src="./assets/js/redirecionamento.js"></script>
    <script src="./assets/js/sessao.js"></script>
    <script src="./assets/js/login.js"></script>

</body>
</html>
